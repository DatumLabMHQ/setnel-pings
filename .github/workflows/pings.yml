name: pings
# Setnel's two five-minute heartbeats, moved out of the private setnel repo so they run on a public repo
# (GitHub Actions is free for public repos; in setnel they cost ~17,000 minutes a month). No secrets: every
# URL here is a public health or cron route. Keep the lists in step with setnel/config/dashboards.yaml and
# setnel/.github/workflows/setnel-ping.yml.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
concurrency:
  group: pings
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger each dashboard's own detectors (setnel-ping)
        run: |
          URLS=(
            "https://datumlabs-aavev3dashboard.datumlabs.workers.dev/api/setnel/cron"
            "https://suilending.datumlabs.workers.dev/api/setnel/cron"
          )
          for url in "${URLS[@]}"; do
            code=$(curl -s -o /dev/null --max-time 90 -w "%{http_code}" "$url" || echo 000); echo "$code $url"
          done
      - name: Keep dashboard functions warm (monitor-warmup)
        run: |
          # Enabled dashboards from setnel/config/dashboards.yaml, baseUrl + healthPath.
          URLS=(
            "https://datumlabs-aavev3dashboard.datumlabs.workers.dev/api/health"
            "https://centrifuge-rwa-dashboard.datumlabs.workers.dev/api/health"
            "https://suilending.datumlabs.workers.dev/api/health"
            "https://defi-tvl-dashboard.vercel.app/api/health"
            "https://liquidator-economy-dashboard.datumlabs.workers.dev/"
            "https://lending-intelligence-terminal.datumlabs.workers.dev/"
            "https://sparklend-dashboard.vercel.app/"
            "https://www.duneuk.com/"
          )
          for url in "${URLS[@]}"; do
            code=$(curl -s -o /dev/null --max-time 30 -w "%{http_code}" "$url" || echo 000); echo "$code $url"
          done
